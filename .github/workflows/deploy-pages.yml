name: Deploy Arabic Next Steps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate the application directory
        id: locate
        shell: bash
        run: |
          PROJECT_DIR="."
          if [ ! -f "package.json" ] && [ -f "Teacher-Report-Comment-Generator/package.json" ]; then
            PROJECT_DIR="Teacher-Report-Comment-Generator"
          fi
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "Unable to find package.json in the repository root or nested project folder."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.locate.outputs.project_dir }}/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm ci

      - name: Build production site
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.project_dir }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
